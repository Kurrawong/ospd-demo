name: Deploy release to dev

on:
  release:
    types: [published]

concurrency:
  group: deploy-release-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
          cache: true
          cache_dependency_path: .github/scripts/validate-release-tag.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate release tag
        run: bash .github/scripts/validate-release-tag.sh "$RELEASE_TAG"

  build-prez:
    name: Build Prez Function App
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: prez/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.7
          enable-cache: true
          cache-dependency-glob: prez/uv.lock

      - name: Test and package Prez
        working-directory: prez
        shell: bash
        run: |
          uv sync --locked --no-dev
          uv run python -m unittest discover -s tests -v
          uv export --locked --no-dev --output-file requirements.txt
          uv pip install \
            --python .venv/bin/python \
            --target .python_packages/lib/site-packages \
            --requirements requirements.txt
          test -f host.json
          test -f function_app.py
          test -f config/endpoints/data_endpoints_default/default_endpoints.ttl
          test -f .python_packages/lib/site-packages/azure/functions/__init__.py
          test -d .python_packages/lib/site-packages/prez
          test -f .python_packages/lib/site-packages/prez/pyproject.toml

      - name: Stage Prez deployment package
        working-directory: prez
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/prez-package"
          mkdir "$package_dir"
          rsync --archive --exclude-from=.funcignore ./ "$package_dir/"
          test -f "$package_dir/host.json"
          test -f "$package_dir/function_app.py"
          test -d "$package_dir/config"
          test -d "$package_dir/.python_packages/lib/site-packages/prez"
          test -f "$package_dir/.python_packages/lib/site-packages/prez/pyproject.toml"
          test ! -e "$package_dir/tests"
          test ! -e "$package_dir/uv.lock"
          (
            cd "$package_dir"
            env -u PREZ_VERSION \
              PYTHONPATH="$package_dir/.python_packages/lib/site-packages:$package_dir" \
              SPARQL_REPO_TYPE=remote \
              SPARQL_ENDPOINT=https://example.invalid/sparql \
              SPARQL_USERNAME=ospd \
              SPARQL_PASSWORD=test-only \
              ENABLE_SPARQL_ENDPOINT=true \
              FUNCTION_APP_AUTH_LEVEL=ANONYMOUS \
              python -c 'import function_app; assert len(function_app.app.get_functions()) == 1'
          )
          cd "$package_dir"
          zip --quiet --recurse-paths "$RUNNER_TEMP/prez-package.zip" .

      - name: Upload Prez deployment package
        uses: actions/upload-artifact@v7
        with:
          name: prez-function-package
          path: ${{ runner.temp }}/prez-package.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-prez:
    name: Deploy Prez Function App
    needs: build-prez
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.PREZ_API_ENDPOINT }}
    permissions:
      id-token: write

    steps:
      - name: Download Prez deployment package
        uses: actions/download-artifact@v8
        with:
          name: prez-function-package
          path: ${{ runner.temp }}/prez-artifact

      - name: Log in to Azure with OIDC
        uses: Azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Prez
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: ${{ runner.temp }}/prez-artifact/prez-package.zip

      - name: Check Prez health
        env:
          PREZ_API_ENDPOINT: ${{ vars.PREZ_API_ENDPOINT }}
        shell: bash
        run: |
          health_url="${PREZ_API_ENDPOINT%/}/health"
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error --max-time 30 --output /dev/null "$health_url"; then
              exit 0
            fi
            echo "Prez health check attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "Prez did not become healthy at $health_url" >&2
          exit 1

      - name: Summarize Prez deployment
        if: always()
        shell: bash
        run: |
          {
            echo "### Prez Function App"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Target: \`${{ vars.AZURE_FUNCTION_APP_NAME }}\`"
            echo "- URL: ${{ vars.PREZ_API_ENDPOINT }}"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prez-ui:
    name: Deploy Prez UI
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ vars.PREZ_UI_URL }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
          cache: true
          cache_dependency_path: prez-ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Build Prez UI
        working-directory: prez-ui
        env:
          NUXT_PUBLIC_PREZ_API_ENDPOINT: ${{ vars.PREZ_API_ENDPOINT }}
        shell: bash
        run: |
          test -n "$NUXT_PUBLIC_PREZ_API_ENDPOINT"
          pnpm install --frozen-lockfile
          pnpm types
          pnpm generate
          test -f .output/public/index.html
          test -f .output/public/staticwebapp.config.json

      - name: Deploy Prez UI
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PREZ_UI_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: prez-ui/.output/public
          skip_app_build: true

      - name: Check Prez UI
        env:
          PREZ_UI_URL: ${{ vars.PREZ_UI_URL }}
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 30 --output /dev/null "$PREZ_UI_URL"

      - name: Summarize Prez UI deployment
        if: always()
        shell: bash
        run: |
          {
            echo "### Prez UI"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: ${{ vars.PREZ_UI_URL }}"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ld-client:
    name: Deploy LD Client
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.LD_CLIENT_URL }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ld-client/package-lock.json

      - name: Build LD Client
        working-directory: ld-client
        env:
          VITE_SPARQL_ENDPOINT: ${{ vars.LD_CLIENT_SPARQL_ENDPOINT }}
        shell: bash
        run: |
          test -n "$VITE_SPARQL_ENDPOINT"
          npm ci --no-audit --no-fund
          npm run build
          npm run test:build

      - name: Deploy LD Client
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.LD_CLIENT_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: ld-client/dist
          skip_app_build: true

      - name: Check LD Client
        env:
          LD_CLIENT_URL: ${{ vars.LD_CLIENT_URL }}
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 30 --output /dev/null "$LD_CLIENT_URL"

      - name: Summarize LD Client deployment
        if: always()
        shell: bash
        run: |
          {
            echo "### LD Client"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: ${{ vars.LD_CLIENT_URL }}"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
