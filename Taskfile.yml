# https://Taskfile.dev

version: 3

silent: true

vars:
  fuseki_version: "5.5.0-0"
  prez_version: "4.23.7"
  prezui_version: "4.3.3"
  kurra_version: "2.0.4"
  prez_image: "prezdemo-prez:{{.prez_version}}"
  prez_stock_image: "ghcr.io/rdflib/prez:{{.prez_version}}"

tasks:
  install:prez-ui:
    cmds:
      - echo "Creating new Prez UI app in ./prez-ui"
      - pnpm dlx create-prez-app@{{.prezui_version}} prez-ui
      - echo "Installing Prez UI dependencies"
      - |
        pnpm add -De --prefix prez-ui prez-ui@{{.prezui_version}} \
          --allow-build=prez-ui \
          --allow-build=prez-lib \
          --allow-build=prez-components \
          --allow-build='@fortawesome/fontawesome-common-types' \
          --allow-build='@fortawesome/free-solid-svg-icons' \
          --allow-build=esbuild \
          --allow-build=vue-demi
      - pnpm install --prefix prez-ui
    status:
      - test -d prez-ui

  build:prez-ui:
    dir: prez-ui
    cmds:
      - echo "Generating Prez UI static files"
      - pnpm generate
    status:
      - test -f dist/index.html

  build:prez:
    cmds:
      - |
        if test -f prez/Dockerfile; then
          echo "Building Prez from prez/Dockerfile"
          prez_build_context="$(mktemp -d /tmp/prezdemo-prez-build.XXXXXX)"
          trap 'rm -rf "$prez_build_context"' EXIT
          cp -RL prez/. "$prez_build_context/"
          docker build \
            --build-arg PREZ_VERSION={{.prez_version}} \
            --tag {{.prez_image}} \
            "$prez_build_context"
        else
          echo "No prez/Dockerfile found; using {{.prez_stock_image}}"
        fi

  dev:up:
    cmds:
      - task: build:prez
      - echo "Standing up the compose stack"
      - |
        prez_image={{.prez_stock_image}}
        if test -f prez/Dockerfile; then
          prez_image={{.prez_image}}
        fi

        FUSEKI_VERSION={{.fuseki_version}} \
          PREZ_IMAGE="$prez_image" \
          docker compose -f docker/compose.yml up -d

  dev:down:
    cmds:
      - echo "Taking down the compose stack"
      - |
        prez_image={{.prez_stock_image}}
        if test -f prez/Dockerfile; then
          prez_image={{.prez_image}}
        fi
        FUSEKI_VERSION={{.fuseki_version}} PREZ_IMAGE="$prez_image" docker compose -f docker/compose.yml down

  dev:restart:
    cmds:
      - task: build:prez
      - |
        prez_image={{.prez_stock_image}}
        if test -f prez/Dockerfile; then
          prez_image={{.prez_image}}
        fi

        FUSEKI_VERSION={{.fuseki_version}} PREZ_IMAGE="$prez_image" docker compose -f docker/compose.yml up -d --force-recreate

  dev:restart-prez:
    cmds:
      - task: build:prez
      - |
        prez_image={{.prez_stock_image}}
        if test -f prez/Dockerfile; then
          prez_image={{.prez_image}}
        fi

        FUSEKI_VERSION={{.fuseki_version}} \
          PREZ_IMAGE="$prez_image" \
          docker compose -f docker/compose.yml up -d --force-recreate prez

  dev:load:
    cmds:
      - echo "Loading data recursively from the ./data folder"
      - uvx kurra@{{.kurra_version}} db gsp clear http://localhost:3030/demods -g https://graphs/prezdemo
      - |
        find -L data -type f -name '*.ttl' -print | sort | while IFS= read -r rdf_file; do
          echo "Loading $rdf_file"
          uvx kurra@{{.kurra_version}} db gsp post "$rdf_file" http://localhost:3030/demods -g https://graphs/prezdemo
        done

  dev:reload:
    cmds:
      - task: dev:load
      # Prez discovers data-defined profiles and prefixes during startup, so it
      # must restart after the data has been loaded into Fuseki.
      - task: dev:restart-prez
  demo:start:
    cmds:
      - task: install:prez-ui
      - task: build:prez-ui
      - task: dev:up
      - task: dev:load
      # Reload Prez's in-memory profile and prefix registries from the data.
      - task: dev:restart-prez
      - echo "Opening Prez UI (http://localhost:3000/catalogs) in the default web browser."
      - uv run python -m webbrowser -t 'http://localhost:3000/catalogs'
  demo:stop:
    cmds:
      - task: dev:down
