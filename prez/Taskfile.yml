# https://taskfile.dev

version: "3"

tasks:
  uv:sync:
    desc: Sync the Azure Functions Python environment
    cmd: uv sync --locked --all-extras --dev

  uv:lock:
    desc: Refresh the Python dependency lockfile
    cmd: uv lock

  uv:export:
    desc: Export deployment dependencies to requirements.txt
    cmd: uv export --no-dev --output-file requirements.txt -q

  dev:
    desc: Run Prez through the local Azure Functions host on port 7071
    cmd: uv run func start
