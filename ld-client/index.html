<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Look up register-owning organisations for OSPD activity types.">
  <title>Activity Type Governance Lookup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">OSPD linked data client</p>
      <h1 id="page-title">Activity Type Governance Lookup</h1>
      <p class="intro">
        Select an
        <span class="tooltip-trigger" tabindex="0" aria-describedby="activity-type-tooltip">
          Activity Type
          <span id="activity-type-tooltip" class="tooltip" role="tooltip">A defined type of activity</span>
        </span>
        to find the organizations that Activity's definition depends on.
      </p>

      <form id="lookup-form">
        <label for="activity">Activity Type:</label>
        <div class="controls">
          <select id="activity" name="activity" aria-describedby="activity-hint" disabled>
            <option value="">Loading activity types…</option>
          </select>
          <button type="submit" disabled>Go!</button>
        </div>
        <p id="activity-hint" class="hint">Hint: Select SAVI or NDVI to see Activities with multiple results</p>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <h2 id="results-title">Register owners</h2>
        <ul id="organisation-list"></ul>
      </section>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
